name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, master]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dev PEMs must not be in HEAD
        run: |
          set -euo pipefail
          if git ls-files -- 'docker/secrets/*.pem' | grep -q .; then
            echo "docker/secrets/*.pem must not be committed. Generate with make prepare-secrets." >&2
            git ls-files -- 'docker/secrets/*.pem' >&2
            exit 1
          fi
