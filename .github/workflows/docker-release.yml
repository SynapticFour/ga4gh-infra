name: Docker Release

on:
  push:
    tags:
      - "aai-broker-v*"
      - "visa-registry-v*"
      - "duo-service-v*"
      - "service-registry-v*"
      - "access-decision-service-v*"
      - "ga4gh-infra-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Per-crate tags still push one image (aai-broker-v0.3.0 → aai-broker:0.3.0).
  crate-image:
    name: Build crate image
    if: ${{ !startsWith(github.ref_name, 'ga4gh-infra-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare Docker vendor tree
        run: ./scripts/prepare-docker-vendor.sh
      - name: Parse crate tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          case "${tag}" in
            aai-broker-v*) image=aai-broker; dockerfile=docker/Dockerfile.broker ;;
            visa-registry-v*) image=visa-registry; dockerfile=docker/Dockerfile.visa-registry ;;
            duo-service-v*) image=duo-service; dockerfile=docker/Dockerfile.duo-service ;;
            service-registry-v*) image=service-registry; dockerfile=docker/Dockerfile.service-registry ;;
            access-decision-service-v*) image=access-decision-service; dockerfile=docker/Dockerfile.access-decision-service ;;
            *) echo "Unsupported crate tag: ${tag}" >&2; exit 1 ;;
          esac
          version="${tag##*-v}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "dockerfile=${dockerfile}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "owner=${owner}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.image }}:latest

  # Stack tag ga4gh-infra-vX.Y.Z pushes every service image as :X.Y.Z
  # so compose pins match the git tag (crate Cargo.toml may stay 0.1.0).
  stack-images:
    name: Stack ${{ matrix.image }}
    if: ${{ startsWith(github.ref_name, 'ga4gh-infra-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aai-broker
            dockerfile: docker/Dockerfile.broker
          - image: visa-registry
            dockerfile: docker/Dockerfile.visa-registry
          - image: duo-service
            dockerfile: docker/Dockerfile.duo-service
          - image: service-registry
            dockerfile: docker/Dockerfile.service-registry
          - image: access-decision-service
            dockerfile: docker/Dockerfile.access-decision-service
          - image: agreement-registry
            dockerfile: docker/Dockerfile.agreement-registry
          - image: admin-ui
            dockerfile: docker/Dockerfile.admin-ui
          - image: sample-resource
            dockerfile: docker/Dockerfile.sample-resource
          - image: mock-idp
            dockerfile: docker/Dockerfile.mock-idp
          - image: register-tools
            dockerfile: docker/Dockerfile.register
          - image: ga4gh-infra
            dockerfile: docker/Dockerfile.all-in-one
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare Docker vendor tree
        run: ./scripts/prepare-docker-vendor.sh
      - name: Stack version
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag##*-v}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "owner=${owner}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:latest
