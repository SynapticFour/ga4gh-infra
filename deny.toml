# Supply-chain policy for ga4gh-infra. Modelled on Ferrum deny.toml
# (licenses, advisories, bans, sources). ga4gh-infra is Apache-2.0.
# BUSL-1.1 is not allowed: this workspace does not ship BUSL crates.

[graph]
targets            = []
exclude-unpublished = true

[advisories]
yanked       = "warn"
unmaintained = "workspace"
ignore       = [
    # rsa 0.9 (Marvin timing side channel, no patched 0.9 release) remains via openidconnect 4
    # in aai-broker (OIDC client; verifies signatures, does no RSA decryption). jsonwebtoken
    # is on 12 / rsa 0.10. CI cargo-audit and verify-release ignore the same ID.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 via openidconnect 4 (aai-broker OIDC client, signature verification only). No patched rsa 0.9 release." },
    # chrono: "unmaintained" notice only (no vulnerability, no patched version). Same decision
    # as Ferrum (deny.toml, issue "Replace chrono with jiff or time"); revisit by 2027-03-31.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (no vulnerability); migration tracked with Ferrum, revisit by 2027-03-31" },
]

[licenses]
version              = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # webpki-roots 0.26.11 and 1.0.7 ship CDLA-Permissive-2.0 as their sole license.
    "CDLA-Permissive-2.0",
]
# Crates with publish = false (sample-resource, integration tests, service bins).
[licenses.private]
ignore = true

[[licenses.clarify]]
name          = "ring"
expression    = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name       = "fuchsia-cprng"
version    = "0.1.1"
expression = "BSD-3-Clause"
license-files = [{ path = "LICENSE", hash = 0xf04ece33 }]

[bans]
multiple-versions = "warn"
wildcards         = "warn"
highlight         = "all"
deny              = []
skip              = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
