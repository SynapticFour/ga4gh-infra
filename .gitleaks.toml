# Gitleaks configuration (see https://github.com/gitleaks/gitleaks)
#
# docker/secrets/*.pem are dev-only RSA keys for local docker-compose (see
# docker/secrets/README.md and SECURITY.md). Production must rotate all keys.

[extend]
useDefault = true

[allowlist]
description = "Dev-only docker-compose signing keys (not production secrets)"
paths = [
  '''^docker/secrets/.*\.pem$''',
]
