# Gitleaks configuration (see https://github.com/gitleaks/gitleaks)
#
# Historical docker/secrets/*.pem (removed from HEAD) remain in git history
# and are treated as public. Allowlist keeps scans green; do not re-add PEMs.

[extend]
useDefault = true

[allowlist]
description = "Historical dev PEMs (removed from HEAD; do not reintroduce)"
paths = [
  '''^docker/secrets/.*\.pem$''',
]
