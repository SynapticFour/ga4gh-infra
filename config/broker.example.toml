[server]
host = "0.0.0.0"
port = 8080
external_url = "https://aai.example.org"
# Deployment environment: prod, test, dev, staging, or development
environment = "prod"
# Origins allowed as OAuth return_url (scheme + host + port). Required outside development.
allowed_return_url_origins = ["https://admin.example.org"]
login_rate_limit_per_minute = 20

[signing]
private_key_pem = "/secrets/broker_rs256.pem"
# Keep Passport TTL short so visa revocation is observed without waiting a day.
passport_lifetime_seconds = 900
token_lifetime_seconds = 900

[session]
# Session store for the RP login flow (server-side, signed cookies)
cookie_secret_env = "BROKER_COOKIE_SECRET"
session_lifetime_seconds = 600

# One or more upstream IdPs the broker delegates authentication to.
# Each institute deploying this broker configures their own IdP here.
[[upstream_idps]]
name = "my-institute"
issuer = "https://idp.my-institute.org/realms/main"
client_id = "ga4gh-broker"
client_secret_env = "MY_INSTITUTE_CLIENT_SECRET"
scopes = ["openid", "profile", "email", "eduperson_entitlement"]
# Optional: map upstream claims to GA4GH identity claims
[upstream_idps.claim_mapping]
sub = "sub"
email = "email"
affiliation = "eduperson_scoped_affiliation"

[[visa_sources]]
name = "local-registry"
url = "http://visa-registry:8081"
api_key_env = "REGISTRY_BOOTSTRAP_API_KEY"
required = true

# Flat claim from signature-checked visas. Off keeps today's passport:
# groups come from the upstream ID token, aud is omitted, and visas are
# embedded without a signature check. One audience is shared by every
# resource server that accepts it, so a token valid for one is valid for
# the others. verify_embedded_visas stays off.
[token_claims]
enabled = false
verify_embedded_visas = false
# claim_name = "groups"
# visa_type = "AffiliationAndRole"
# audiences = ["https://resources.example.org"]
# jwks_file = "/secrets/visa-issuer.jwks.json"

